    tier: paid
    key_env: GOOGLE_API_KEY
    base_url_env: GOOGLE_BASE_URL
    default_base_url: https://generativelanguage.googleapis.com/v1beta/openai
    role_presets:
      planner:   gemini-2.5-pro
      executor:  gemini-2.5-flash
      verifier:  gemini-2.5-flash
      judge:     gemini-2.5-pro
    candidates:
      - gemini-2.5-flash
      - gemini-2.5-pro
      - gemini-2.0-flash
      - gemini-1.5-pro
      - gemini-1.5-flash

  # ── Old local-colibri comment divider (kept for backwards-compat in any older
  #     editor that diff-position-grepped for "Local Ollama" — re-inserted
  #     below as the actual section header.
  # ── Local (no key, no rate limit — opt-in via UI or BRAIN_PREFERENCE) ────

  ollama:
    display_name: Local Ollama (no key, private)
    tier: local
    key_env: null  # local — no key
    base_url_env: OLLAMA_BASE  # also accepts OLLAMA_BASE_URL
    default_base_url: http://localhost:11434
    # The executor (code-writing) role defaults to Cohere's north-mini-code-1.0
    # — a 30B/3B-active MoE agentic coding model (Apache-2.0, 256K context,
    # native tool use + interleaved thinking, SWE-bench Verified 67.6) purpose-
    # built to drive the full plan→execute→verify trajectory locally. Pull it
    # with `ollama run north-mini-code-1.0` (q4_K_M ≈ 19 GB). Switch back to a
    # generic coder from the Brain card or via NORTH_MINI_CODE_DEFAULT=false.
    role_presets:
      planner:   deepseek-r1:32b
      executor:  north-mini-code-1.0
      verifier:  deepseek-r1:32b
      judge:     deepseek-r1:32b
    candidates:
      - north-mini-code-1.0
      - deepseek-r1:32b
      - qwen3-coder:30b
      - qwen3-coder:7b
      - llama3.3:70b
