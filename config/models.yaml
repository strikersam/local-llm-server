    # tier (cohere/north-mini-code:free) so the cloud coding path uses the same
    # agentic coding model as the local Ollama path.
    role_presets:
      planner:   meta-llama/llama-3.3-70b-instruct
      executor:  cohere/north-mini-code:free
      verifier:  meta-llama/llama-3.3-70b-instruct
      judge:     meta-llama/llama-3.3-70b-instruct
    candidates:
      - cohere/north-mini-code:free
      - meta-llama/llama-3.3-70b-instruct
      - anthropic/claude-3.5-sonnet

  anthropic:
