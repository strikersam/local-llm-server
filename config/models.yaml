# config/models.yaml — Canonical model catalog for the agency's brain.
#
# This file is the single source of truth for:
#   • per-provider display metadata (name, tier, base_url, key_env)
#   • per-provider role presets (planner / executor / verifier / judge)
#   • per-provider candidate failover list (used by the watchdog /
#     brain_failover chain when the primary model 410s / 404s / times out)
#
# Loaded by `packages/ai/brain_config.py::load_models_yaml()` at module
# import time. If the file is missing or corrupt, the module falls back to
# the in-module hardcoded defaults (kept in sync with this file) so a bad
# YAML edit can never brick the agent loop.
#
# Format (per provider):
#   providers:
#     <provider-id>:
#       display_name:  Human-readable label for the BrainCard dropdown
#       tier:          free | paid | local  (drives failover ordering)
#       key_env:       env-var name that holds the API key (null for ollama)
#       base_url_env:  env-var name for optional base URL override (null = none)
#       default_base_url:  default public base URL (used when env override absent)
#       role_presets:        # sensible defaults surfaced by the UI's "presets"
#         planner:   <model-id>
#         executor:  <model-id>
#         verifier:  <model-id>
#         judge:     <model-id>
#       candidates:   # ordered failover list — first model is the preset;
#                     # subsequent models are tried in order on 404/410/timeout
#         - <model-id>
#         - <model-id>
#
# Adding a new provider: append an entry here, then add the same id to the
# `BrainProvider` Literal in `packages/ai/brain_config.py`. The literal is
# the validation gate that keeps a typo in the UI from persisting an
# unusable provider.
#
# All model ids here must be live-probed by `services/brain_liveness.py`
# before a BrainConfig with them can be persisted (the PATCH /admin/api/
# policy/brain endpoint refuses dead models with 422).

# Top-level metadata
catalog_version: 1
safe_default:
  provider: nvidia
  model: nvidia/nemotron-3-super-120b-a12b

# Recommended priority for auto-config (first key present wins) and for the
# watchdog's failover chain. Cloud chain is Cerebras → Groq → NVIDIA (NIM).
# Ollama leads so an operator's explicit local-brain choice is preserved
# across cloud failovers.
# PR #1046: nvidia leads the priority (not ollama) because ollama requires
# OLLAMA_BASE_URL which is not set on Render free tier. nvidia is always
# available with NVIDIA_API_KEY. ollama stays in the chain for local dev.
recommended_priority:
  - nvidia
  - tokenin
  - cerebras
  - groq
  - ollama

providers:
  # ── Free tier (preferred) ────────────────────────────────────────────────
  nvidia:
    display_name: NVIDIA NIM (free, broad catalogue)
    tier: free
    key_env: NVIDIA_API_KEY
    base_url_env: NVIDIA_BASE_URL
    default_base_url: https://integrate.api.nvidia.com
    role_presets:
      planner:   nvidia/nemotron-3-super-120b-a12b
      executor:  nvidia/nemotron-3-super-120b-a12b
      verifier:  nvidia/nemotron-3-super-120b-a12b
      judge:     nvidia/nemotron-3-super-120b-a12b
    candidates:
      # Every id here returned HTTP 200 to a live completion on 2026-08-28 via
      # .github/workflows/catalogue-probe.yml against the production key.
      # Ordered by what they actually returned: the first two answered with
      # text, the gpt-oss pair answered 200 with an empty body under an 8-token
      # cap (reasoning models), so they sit behind as fallbacks.
      #
      # Proven dead on that run — do not re-add without a probe:
      #   z-ai/glm-5.2 (410), z-ai/glm-5.1 (410),
      #   meta/llama-4-maverick-17b-128e-instruct (410),
      #   nvidia/nemotron-nano-3-30b-a3b (404),
      #   nvidia/llama-3.1-nemotron-70b-instruct (404),
      #   nvidia/nemotron-4-340b-instruct (404),
      #   nvidia/llama-3.1-nemotron-51b-instruct (404),
      #   deepseek-ai/deepseek-r1 (404),
      #   meta/llama-4-scout-17b-16e-instruct (404),
      #   nvidia/nemotron-3.5-lightning-30b-a3b (404)
      - nvidia/nemotron-3-super-120b-a12b
      # Intermittent, not dead. It 404'd at 17:02 and 17:05 on 2026-08-28 and
      # was wrongly retired on that; it then answered HTTP 200 with a real
      # tool_call at 23:25 (probe run 33220369591), and again on 2026-08-29 at
      # 07:37 (run 33241283346). Behind the default deliberately: the id above
      # has answered on every probe, this one has not.
      - nvidia/nemotron-3-ultra-550b-a55b
      - mistralai/mistral-nemotron
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b

  # tokenin.my.id — free OpenAI-compatible gateway fronting a rotating pool of
  # frontier models (GPT-5.6, Claude Opus 4.8, Gemini 3.5 Flash, GLM 5.3,
  # DeepSeek V4 Pro, Grok 4.6, Kimi K3, MiniMax M3, Qwen 3.8 Max, Mimo V2.5).
  # Every model is $0 with a small per-model RPM cap (2–7 req/min), so the
  # candidate list below is the rotation: on a 429 the failover layer walks to
  # the next model, and the higher-RPM models lead. The `myt/` prefix and exact
  # casing are the provider's own model ids (from the dashboard's copy field).
  tokenin:
    display_name: TokenIn (free frontier gateway)
    tier: free
    key_env: TOKENIN_API_KEY
    base_url_env: TOKENIN_BASE_URL
    default_base_url: https://tokenin.my.id/v1
    role_presets:
      planner:   myt/deepseek-v4-pro-free
      executor:  myt/glm-5.3-free
      verifier:  myt/glm-5.3-free
      judge:     myt/deepseek-v4-pro-free
    candidates:
      - myt/glm-5.3-free
      - myt/deepseek-v4-pro-free
      - myt/MiniMax-M3-free
      - myt/mimo-v2.5-free
      - myt/qwen3.8-max-free
      - myt/kimi-k3-free
      - myt/gemini-3.5-flash-free
      - myt/grok-4.6-free
      - myt/gpt-5.6-sol-free
      - myt/claude-opus-4-8-free

  cerebras:
    display_name: Cerebras (fast, free tier)
    tier: free
    key_env: CEREBRAS_API_KEY
    base_url_env: CEREBRAS_BASE_URL
    default_base_url: https://api.cerebras.ai
    # Probed 2026-08-29 against the live key (run 33259357211): the account's
    # catalogue is exactly gpt-oss-120b and gemma-4-31b. The three ids that were
    # here — qwen-3-coder-480b, llama-3.3-70b, llama-3.1-8b — every one answered
    # 404, so this provider had no working entry at all.
    #
    # Neither replacement has answered a completion either: both return
    # 402 Payment Required, which is an account state, not a model state. The
    # chain fails over to Groq meanwhile. Re-probe when billing is settled.
    #
    # 2026-09-07: catalogue-probe found gpt-oss-120b returns HTTP 402. Removed
    # from role_presets and candidates; only gemma-4-31b remains.
    role_presets:
      planner:   gemma-4-31b
      executor:  gemma-4-31b
      verifier:  gemma-4-31b
      judge:     gemma-4-31b
    candidates:
      - gemma-4-31b

  groq:
    display_name: Groq (fast, free tier)
    tier: free
    key_env: GROQ_API_KEY
    base_url_env: GROQ_BASE_URL
    default_base_url: https://api.groq.com/openai/v1
    # Probed against the live account 2026-09-01 (run 33483861221): each id
    # below returned HTTP 200 to a real completion *and* emitted a genuine
    # tool_call. The three ids previously here — llama-3.3-70b-versatile,
    # deepseek-r1-distill-llama-70b, llama-3.1-8b-instant — are not in this
    # account's catalogue at all and answer 404/400 (run 33483766556).
    # groq/compound answers chat but rejects tools (400), so it is not a
    # candidate for agent roles. Do not add an id here that has not answered.
    role_presets:
      planner:   openai/gpt-oss-120b
      executor:  openai/gpt-oss-120b
      verifier:  openai/gpt-oss-120b
      judge:     openai/gpt-oss-120b
    candidates:
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
      - qwen/qwen3.8-27b

  mistral:
    display_name: Mistral (free tier)
    tier: free
    key_env: MISTRAL_API_KEY
    base_url_env: MISTRAL_BASE_URL
    default_base_url: https://api.mistral.ai/v1
    role_presets:
      planner:   mistral-large-latest
      executor:  mistral-small-latest
      verifier:  mistral-small-latest
      judge:     mistral-large-latest
    candidates:
      - mistral-small-latest
      - mistral-large-latest
      - codestral-latest
      - mistral-nemo

  deepseek:
    display_name: DeepSeek (free tier)
    tier: free
    key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    default_base_url: https://api.deepseek.com/v1
    role_presets:
      planner:   deepseek-chat
      executor:  deepseek-coder
      verifier:  deepseek-chat
      judge:     deepseek-chat
    candidates:
      - deepseek-chat
      - deepseek-reasoner
      - deepseek-coder

  zhipu:
    display_name: ZhipuAI / GLM (China)
    tier: free
    key_env: ZHIPU_API_KEY
    base_url_env: ZHIPU_BASE_URL
    default_base_url: https://open.bigmodel.cn/api/paas/v4
    role_presets:
      planner:   glm-5.2
      executor:  glm-5.2
      verifier:  glm-5.2
      judge:     glm-5.2
    candidates:
      - glm-5.2
      - glm-5.1
      - glm-4
      - glm-4-flash
      - glm-4-air

  zai:
    display_name: Z.ai (GLM international)
    tier: free
    key_env: ZAI_API_KEY
    base_url_env: ZAI_BASE_URL
    default_base_url: https://api.z.ai/api/paas/v4
    role_presets:
      planner:   glm-5.2
      executor:  glm-5.2
      verifier:  glm-5.2
      judge:     glm-5.2
    candidates:
      - glm-5.2
      - glm-5.1
      - glm-4-flash
      - glm-4
      - glm-4-air

  together:
    display_name: Together AI (free tier)
    tier: free
    key_env: TOGETHER_API_KEY
    base_url_env: TOGETHER_BASE_URL
    default_base_url: https://api.together.xyz/v1
    role_presets:
      planner:   Llama-3.3-70B-Instruct-Turbo-Free
      executor:  Llama-3.3-70B-Instruct-Turbo-Free
      verifier:  Llama-3.3-70B-Instruct-Turbo-Free
      judge:     Llama-3.3-70B-Instruct-Turbo-Free
    candidates:
      - Llama-3.3-70B-Instruct-Turbo-Free
      - Mixtral-8x7B-Instruct-v0.1-Free

  dashscope:
    display_name: Qwen DashScope (Alibaba)
    tier: free
    key_env: DASHSCOPE_API_KEY
    base_url_env: DASHSCOPE_BASE_URL
    default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    role_presets:
      planner:   qwen-plus
      executor:  qwen-coder-plus
      verifier:  qwen-plus
      judge:     qwen-plus
    candidates:
      - qwen-plus
      - qwen-max
      - qwen-turbo
      - qwen-coder-plus

  moonshot:
    display_name: Moonshot / Kimi (China)
    tier: free
    key_env: MOONSHOT_API_KEY
    base_url_env: MOONSHOT_BASE_URL
    default_base_url: https://api.moonshot.cn/v1
    role_presets:
      planner:   moonshot-v1-32k
      executor:  moonshot-v1-32k
      verifier:  moonshot-v1-32k
      judge:     moonshot-v1-32k
    candidates:
      - moonshot-v1-8k
      - moonshot-v1-32k
      - moonshot-v1-128k

  # ── Paid tier (only tried when ALLOW_PAID_BRAIN=true) ────────────────────
  openrouter:
    display_name: OpenRouter (paid aggregator)
    tier: paid
    key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    default_base_url: https://openrouter.ai/api/v1
